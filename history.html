<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#176b58">
    <title>A-G 후보 검증 이력</title>
    <link rel="stylesheet" href="monitor.css?v=20261010-10">
  </head>
  <body>
    <header class="topbar">
      <div class="brand-lockup">
        <div>
          <h1>A-G 후보 검증 이력</h1>
        </div>
      </div>
      <nav aria-label="화면 이동">
        <div id="historyNotice" class="history-status"><strong id="historyStatus">검증 이력 확인 중</strong><span id="historyUpdatedAt"></span></div>
        <a class="history-link" href="monitor.html">현재 감시</a>
        <button id="refreshButton" type="button">새로고침</button>
      </nav>
    </header>

    <main class="history-page">
      <section aria-label="종료 후보 요약">
        <table class="history-summary-table">
          <thead><tr><th>종목수</th><th>5% 달성수</th><th>달성률</th></tr></thead>
          <tbody><tr><td id="completedCount">-</td><td id="reachedCount">-</td><td id="reachedRate">-</td></tr></tbody>
        </table>
        <p id="evaluationNote" class="history-evaluation-note"></p>
      </section>


      <section class="history-panel" aria-label="A-G 종료 후보">
        <div class="section-heading">
          <div>
            <h2>세부리스트</h2>
          </div>
          <strong class="history-target">목표 +5%</strong>
        </div>
        <div class="history-toolbar">
          <p id="historyMeta">종료된 후보부터 이력이 쌓입니다.</p>
          <label class="search-field">
            <span>종목 검색</span>
            <input id="historyKeyword" type="search" placeholder="종목명 또는 코드">
          </label>
        </div>
        <div id="historyList" class="history-list">
          <div class="empty-list">검증 이력을 불러오는 중입니다.</div>
        </div>
      </section>
    </main>

    <script src="history.js?v=20261010-10"></script>
  </body>
</html>
