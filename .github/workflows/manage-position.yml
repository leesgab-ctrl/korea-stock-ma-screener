name: Register, edit, or close a purchased stock

on:
  workflow_dispatch:
    inputs:
      action:
        description: buy는 신규등록 또는 같은 종목의 손절가 수정, sold는 매도완료
        required: true
        type: choice
        options:
          - buy
          - sold
          - exclude
          - restore
      code:
        description: 종목코드 6자리
        required: true
        type: string
      reason:
        description: 사용자 선정 제외 이유
        required: false
        type: string
      name:
        description: 종목명 (매수 등록 시 입력)
        required: false
        type: string
      buy_price:
        description: 매수가 (매수 등록 시 입력)
        required: false
        type: string
      quantity:
        description: 매수 또는 매도 수량
        required: false
        type: string
      stop_price:
        description: 기술적 손절가 (매수가 대비 -5%보다 낮으면 자동으로 -5% 적용)
        required: false
        type: string
      sell_price:
        description: 매도가 (매도 완료 시 입력)
        required: false
        type: string
      target_pct:
        description: 목표수익률(%)
        required: false
        default: "5"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep current stock data in Pages bundle
        run: curl --fail --retry 3 --silent --show-error -o data/stock-data.json https://leesgab-ctrl.github.io/korea-stock-ma-screener/data/stock-data.json
      - name: Keep current candidate data in Pages bundle
        continue-on-error: true
        run: |
          curl --fail --retry 3 --silent --show-error -o /tmp/candidate-monitor.json https://leesgab-ctrl.github.io/korea-stock-ma-screener/data/candidate-monitor.json
          mv /tmp/candidate-monitor.json data/candidate-monitor.json
      - name: Register purchase
        if: inputs.action == 'buy'
        env:
          CODE: ${{ inputs.code }}
          NAME: ${{ inputs.name }}
          BUY_PRICE: ${{ inputs.buy_price }}
          QUANTITY: ${{ inputs.quantity }}
          STOP_PRICE: ${{ inputs.stop_price }}
          TARGET_PCT: ${{ inputs.target_pct }}
        run: |
          ARGS=(--action buy --code "$CODE" --name "$NAME" --buy-price "$BUY_PRICE" --quantity "$QUANTITY" --target-pct "$TARGET_PCT")
          if [ -n "$STOP_PRICE" ]; then ARGS+=(--stop-price "$STOP_PRICE"); fi
          python scripts/manage_positions.py "${ARGS[@]}"
      - name: Manage candidate exclusion
        if: inputs.action == 'exclude' || inputs.action == 'restore'
        env:
          CODE: ${{ inputs.code }}
          REASON: ${{ inputs.reason }}
          ACTION: ${{ inputs.action }}
        run: python scripts/manage_candidate_exclusions.py --action "$ACTION"
      - name: Mark as sold
        if: inputs.action == 'sold'
        env:
          CODE: ${{ inputs.code }}
          SELL_PRICE: ${{ inputs.sell_price }}
          QUANTITY: ${{ inputs.quantity }}
        run: python scripts/manage_positions.py --action sold --code "$CODE" --sell-price "$SELL_PRICE" --quantity "$QUANTITY"
      - name: Save position
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$INPUT_ACTION" = "exclude" ] || [ "$INPUT_ACTION" = "restore" ]; then
            git add data/candidate-exclusions.json data/candidate-monitor.json
          else
            git add data/positions.json
          fi
          git diff --cached --quiet || git commit -m "Update stock registration ${INPUT_CODE}"
          git push
        env:
          INPUT_CODE: ${{ inputs.code }}
          INPUT_ACTION: ${{ inputs.action }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
