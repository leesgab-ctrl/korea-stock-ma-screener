name: Update stock screener
run-name: Candidate scan ${{ inputs.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Manual candidate scan request identifier
        type: string
        default: ""
  schedule:
    - cron: "30 23 * * 0-4"
    - cron: "40 7 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate stock data
        run: python scripts/generate_static_data.py --output data/stock-data.json --workers 32
      - name: Restore accumulated candidate history
        continue-on-error: true
        run: |
          curl --fail --retry 3 --silent --show-error -o /tmp/candidate-monitor.json https://leesgab-ctrl.github.io/korea-stock-ma-screener/data/candidate-monitor.json
          mv /tmp/candidate-monitor.json data/candidate-monitor.json
      - name: Refresh A-G and A-K candidates
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CANDIDATE_SCAN_REQUEST_ID: ${{ inputs.request_id }}
        run: python scripts/update_candidate_monitor.py --mode daily --no-notify
      - name: Refresh AH candidates and review alerts
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python -m unittest discover -s scripts -p test_ah_monitor.py
          python scripts/update_ah_monitor.py
      - name: Save candidate membership
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidate-monitor.json data/ah-monitor.json
          git diff --cached --quiet || git commit -m "Update AG AK AH candidate monitor"
          git pull --rebase --autostash origin main
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
