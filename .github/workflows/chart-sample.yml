name: Send labelled chart attachment test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Send one test image
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/send_chart_sample.py
