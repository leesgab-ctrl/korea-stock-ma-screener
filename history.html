<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#176b58">
    <title>후보 검증 이력</title>
    <link rel="stylesheet" href="monitor.css?v=20261030-active-history">
  </head>
  <body>
    <header class="topbar">
      <div class="brand-lockup">
        <div>
          <h1>후보 검증 이력</h1>
        </div>
      </div>
      <nav aria-label="화면 이동">
        <div id="historyNotice" class="history-status"><strong id="historyStatus">검증 이력 확인 중</strong><span id="historyUpdatedAt"></span></div>
      </nav>
    </header>

    <main class="history-page">
      <section aria-label="종료 후보 요약">
        <table class="history-summary-table">
          <thead><tr><th>관리 종료 종목수</th><th>5일 5% 달성률</th><th>10일 5% 달성률</th></tr></thead>
          <tbody><tr><td id="completedCount">-</td><td id="reachedCount">-</td><td id="reachedRate">-</td></tr></tbody>
        </table>
        <p id="evaluationNote" class="history-evaluation-note"></p>
      </section>


      <section class="history-panel" aria-label="전체 관리 이력">
        <div class="section-heading">
          <div>
            <h2>이력리스트</h2>
          </div>
          <div class="history-heading-meta"><span id="historyMeta"></span><strong class="history-target">목표 +5%</strong></div>
        </div>
        <div class="history-toolbar">
          <label class="search-field" for="historyKeyword">
            <span>종목검색</span>
            <input id="historyKeyword" type="search" placeholder="종목명 또는 코드" autocomplete="off">
          </label>
        </div>
        <div id="historyList" class="history-list">
          <div class="empty-list">검증 이력을 불러오는 중입니다.</div>
        </div>
      </section>
    </main>

    <script src="history.js?v=20261030-active-history"></script>
  </body>
</html>
