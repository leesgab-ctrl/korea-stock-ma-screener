name: Monitor 30-minute buy signals

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 0-6 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep latest full-market data in Pages bundle
        continue-on-error: true
        run: curl --fail --retry 3 --silent --show-error -o data/stock-data.json https://junsooo.github.io/korea-stock-ma-screener/data/stock-data.json
      - name: Check active candidates
        id: monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/update_candidate_monitor.py --mode intraday --github-output "$GITHUB_OUTPUT"
      - name: Save newly notified signals
        if: steps.monitor.outputs.alerts != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidate-monitor.json
          git commit -m "Record 30-minute buy signal"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
