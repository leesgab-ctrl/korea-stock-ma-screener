name: Monitor 30-minute buy signals

on:
  workflow_dispatch:
    inputs:
      charts_only:
        description: Refresh display charts without changing signals or sending alerts
        type: boolean
        default: false
  schedule:
    - cron: "*/10 0-6 * * 1-5"
    - cron: "15 6 * * 1-5"
    - cron: "*/10 7-11 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep latest full-market data in Pages bundle
        continue-on-error: true
        run: curl --fail --retry 3 --silent --show-error -o data/stock-data.json https://leesgab-ctrl.github.io/korea-stock-ma-screener/data/stock-data.json
      - name: Restore accumulated candidate history
        continue-on-error: true
        run: |
          curl --fail --retry 3 --silent --show-error -o /tmp/candidate-monitor.json https://leesgab-ctrl.github.io/korea-stock-ma-screener/data/candidate-monitor.json
          mv /tmp/candidate-monitor.json data/candidate-monitor.json
      - name: First-rise preliminary check at 15:10-15:15 and final after 20:30 KST
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CHARTS_ONLY: ${{ inputs.charts_only || false }}
        run: |
          python -m unittest discover -s scripts -p test_first_rise*.py
          if [ "$CHARTS_ONLY" = "true" ]; then
            python scripts/update_first_rise_monitor.py --charts-only --no-notify
          else
            python scripts/update_first_rise_monitor.py
          fi
      - name: Install notification chart renderer
        if: inputs.charts_only != true
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Refresh AH before common monitoring
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CHARTS_ONLY: ${{ inputs.charts_only || false }}
        run: |
          python -m unittest discover -s scripts -p test_ah_monitor.py
          if [ "$CHARTS_ONLY" = "true" ]; then
            python scripts/update_ah_monitor.py --charts-only --no-notify
          else
            python scripts/update_ah_monitor.py
          fi
      - name: Check active candidates
        id: monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CHARTS_ONLY: ${{ inputs.charts_only || false }}
          IMAGES_ONLY: ${{ github.event.schedule == '*/10 7-11 * * 1-5' }}
        run: |
          python -m unittest discover -s scripts -p test_notification_snapshot.py
          python -m unittest discover -s scripts -p test_decline_ma10_ma120_gate.py
          python -m unittest discover -s scripts -p test_decline_alert_policy.py
          python -m unittest discover -s scripts -p test_ma120_recovery_search.py
          python -m unittest discover -s scripts -p test_ma60_near_rebound_search.py
          python -m unittest discover -s scripts -p test_common_monitor.py
          MODE=intraday
          if [ "$CHARTS_ONLY" = "true" ]; then MODE=charts; fi
          if [ "$CHARTS_ONLY" != "true" ] && [ "$IMAGES_ONLY" = "true" ]; then MODE=images; fi
          python scripts/update_candidate_monitor.py --mode "$MODE" --github-output "$GITHUB_OUTPUT"
      - name: Check purchased stocks
        if: inputs.charts_only != true && github.event.schedule != '*/10 7-11 * * 1-5'
        id: positions
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/manage_positions.py --action monitor --github-output "$GITHUB_OUTPUT"
      - name: Save newly notified signals
        if: steps.monitor.outputs.common_state_changed == 'true' || steps.monitor.outputs.notification_history_changed == 'true' || (inputs.charts_only != true && (steps.monitor.outputs.alerts != '0' || (steps.positions.outputs.alerts != '' && steps.positions.outputs.alerts != '0') || steps.monitor.outputs.color_state_changed == 'true' || steps.monitor.outputs.archive_tracking_changed == 'true'))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidate-monitor.json data/positions.json
          git commit -m "Record stock monitoring alert"
          git pull --rebase --autostash origin main
          git push
      - name: Build daily price analysis records
        run: node scripts/build_price_analysis.cjs
      - name: Save AH membership and acknowledged alerts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ah-monitor.json data/first-rise-monitor.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AH and first-rise candidate monitors"
            git pull --rebase --autostash origin main
            git push
          fi
      - name: Save price analysis records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price-analysis.json data/reference-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Record daily price analysis"
            git pull --rebase --autostash origin main
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
